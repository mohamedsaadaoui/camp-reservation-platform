spring.application.name=campbackoffice

server.port=8063

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

# JWT
jwt.secret=${JWT_SECRET:camp-reservation-platform-jwt-secret-key-change-me-0123456789abcdef}
jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info
