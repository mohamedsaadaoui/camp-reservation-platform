spring.application.name=emplacement-service

# Server Configuration
server.port=8061

# Datasource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:camp_emplacement_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

# Feign Client Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# Logging
logging.level.com.emplacement_service=DEBUG

# Uploads
upload.dir=${UPLOAD_DIR:./uploads}

# JWT
jwt.secret=${JWT_SECRET:camp-reservation-platform-jwt-secret-key-change-me-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default admin account (created on startup)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Actuator
management.endpoints.web.exposure.include=health,info
