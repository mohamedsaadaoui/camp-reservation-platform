<div class="login-container">
  <div class="login-card">
    <h2>Connexion</h2>
    <p class="subtitle">Accédez à votre espace</p>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Nom d'utilisateur</label>
        <input id="username" type="text" name="username" [(ngModel)]="username" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!username || !password">Se connecter</button>
    </form>
  </div>
</div>
