name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java-services:
    name: Build Java services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [eureka-server, emplacement-service, campbackoffice]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      JWT_SECRET: ci-dummy-jwt-secret-for-build-only-0123456789
      ADMIN_PASSWORD: CiBuild123
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: camp_emplacement_db
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: camp_emplacement_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Verify (tests + package)
        run: ./mvnw -B verify

  reservation-service:
    name: Reservation service (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reservation-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: reservation-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [java-services, reservation-service, frontend]
    env:
      JWT_SECRET: ci-dummy-jwt-secret-for-build-only
      ADMIN_PASSWORD: CiBuild123
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build
